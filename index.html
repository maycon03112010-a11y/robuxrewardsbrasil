<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recompensas Robux</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .avatar-box {
      margin: 20px 0;
      display: none;
    }
    .avatar-box img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      background: #0f172a;
    }
    .tiktok-btn {
      display: none;
      width: 100%;
      padding: 16px;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 20px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
    }
    .tiktok-btn:hover {
      background: #e02648;
    }
    .step-2 {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Recompensas Robux</h2>
    
    <!-- PASSO 1: Nome de usuário -->
    <div id="step-1">
      <p>Digite seu nome de usuário do Roblox:</p>
      <input type="text" id="username" placeholder="Ex: NickRoblox">
      <button onclick="buscarAvatar()">Continuar</button>
    </div>

    <!-- PASSO 2: Confirmar Avatar e Selecionar Robux -->
    <div id="step-2" class="step-2">
      <div class="avatar-box" id="avatarBox">
        <img id="avatarImg" src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-76D5D8A31D0850D695C058ADDCDE4C5F-Png/150/150/AvatarHeadshot/Png/noFilter" alt="Avatar Roblox">
        <p id="userDisplay" style="font-weight: bold; margin-top: 8px; color: #38bdf8;"></p>
        <p style="font-size: 12px; color: #10b981; margin: 4px 0 0 0;">✔ Conta encontrada com sucesso!</p>
      </div>

      <p>Escolha a quantidade de Robux:</p>
      <select id="robuxAmount">
        <option value="400">400 Robux</option>
        <option value="800">800 Robux</option>
        <option value="1700">1.700 Robux</option>
        <option value="4500">4.500 Robux</option>
      </select>

      <button id="generateBtn" onclick="gerarRecompensa()">Gerar Robux</button>
    </div>

    <!-- BOTÃO FINAL: TikTok -->
    <a id="tiktokLink" class="tiktok-btn" href="SEU_LINK_DO_TIKTOK_AQUI" target="_blank">
      Resgatar agora
    </a>
  </div>

  <script>
    function buscarAvatar() {
      const username = document.getElementById('username').value.trim();
      if (!username) {
        alert('Por favor, digite seu nome de usuário!');
        return;
      }

      // Avança o passo de forma limpa e instantânea
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
      document.getElementById('avatarBox').style.display = 'block';
      
      // Exibe o nome que o utilizador digitou na tela
      document.getElementById('userDisplay').innerText = "@" + username;
    }

    function gerarRecompensa() {
      const btn = document.getElementById('generateBtn');
      btn.innerText = 'Processando...';
      btn.disabled = true;

      setTimeout(() => {
        btn.style.display = 'none';
        document.getElementById('https://www.tiktok.com/d/4/ZS9yuJhL6u1LL-SOZ0t/').style.display = 'block';
      }, 1500);
    }
  </script>

</body>
</html>
