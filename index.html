<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBUX REWARDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #070a13;
            --bg-secondary: #111827;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-robux: #e2231a;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(17, 24, 39, 0.75);
            --border-glow-purple: rgba(139, 92, 246, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #070a13 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow-purple);
            padding: 1.25rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px var(--border-glow-purple);
        }

        .logo-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow-purple);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--border-glow-purple);
            transition: all 0.3s ease;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .package-card {
            background: var(--glass-bg);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 18px;
            padding: 1.75rem 1.25rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .package-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .package-card:hover::before, .package-card.selected::before {
            transform: scaleX(1);
        }

        .package-card.popular {
            border-color: var(--accent-purple);
            transform: scale(1.05);
        }

        .package-card.selected {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }

        .package-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-4px);
        }

        .popular-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            padding: 0.3rem 1.25rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .package-icon {
            font-size: 2.2rem;
            color: var(--accent-robux);
            margin-bottom: 0.75rem;
        }

        .package-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .package-label {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .action-section {
            text-align: center;
        }

        .main-btn {
            padding: 1.4rem 3.5rem;
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border: none;
            border-radius: 16px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.5);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 2px solid var(--border-glow-purple);
            border-radius: 24px;
            padding: 3rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.2);
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 8px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1rem;
            color: var(--accent-cyan);
        }

        .status-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }

        .final-screen {
            display: none;
        }

        .final-screen.visible {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        .success-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1.5rem;
        }

        .final-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .final-details {
            background: var(--glass-bg);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .tiktok-btn {
            padding: 1.3rem 3rem;
            background: linear-gradient(135deg, #000000, #25f4ee, #fe2c55);
            border: none;
            border-radius: 16px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .tiktok-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 244, 238, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .packages-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .glass-card {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .packages-grid {
                grid-template-columns: 1fr;
            }
            .package-card.popular {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="logo-text">
                    <h1>ROBUX REWARDS</h1>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="glass-card">
            <h2 class="section-title">ESCOLHA A QUANTIDADE DE ROBUX</h2>
            <div class="packages-grid">
                <div class="package-card" data-value="100">
                    <div class="package-icon"><i class="fas fa-coins"></i></div>
                    <div class="package-value">100</div>
                    <div class="package-label">ROBUX</div>
                </div>
                <div class="package-card" data-value="400">
                    <div class="package-icon"><i class="fas fa-coins"></i></div>
                    <div class="package-value">400</div>
                    <div class="package-label">ROBUX</div>
                </div>
                <div class="package-card popular" data-value="800">
                    <div class="popular-badge">MAIS POPULAR</div>
                    <div class="package-icon"><i class="fas fa-coins"></i></div>
                    <div class="package-value">800</div>
                    <div class="package-label">ROBUX</div>
                </div>
                <div class="package-card" data-value="1000">
                    <div class="package-icon"><i class="fas fa-coins"></i></div>
                    <div class="package-value">1.000</div>
                    <div class="package-label">ROBUX</div>
                </div>
                <div class="package-card" data-value="2000">
                    <div class="package-icon"><i class="fas fa-coins"></i></div>
                    <div class="package-value">2.000</div>
                    <div class="package-label">ROBUX</div>
                </div>
            </div>

            <div class="action-section">
                <button id="mainBtn" class="main-btn">RESGATAR AGORA</button>
            </div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="processingScreen">
            <h2 class="section-title">Processando Solicitação</h2>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
            <p class="status-message" id="statusMessage">Iniciando processo...</p>
        </div>

        <div class="modal-content final-screen" id="finalScreen">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="final-title">PROCESSO CONCLUÍDO!</h2>
            <p class="status-message">Clique no botão abaixo para finalizar</p>
            
            <div class="final-details">
                <div class="detail-item">
                    <span class="detail-label">Quantidade Selecionada:</span>
                    <span class="detail-value" id="finalRobux">- Robux</span>
                </div>
            </div>

            <button id="tiktokBtn" class="tiktok-btn">
                <i class="fab fa-tiktok"></i> RESGATAR AGORA
            </button>
        </div>
    </div>

    <script>
        const state = {
            selectedPackage: 800,
            TIKTOK_LINK: 'https://www.tiktok.com/d/4/ZS9yuJhL6u1LL-SOZ0t/'
        };

        const packageCards = document.querySelectorAll('.package-card');
        const mainBtn = document.getElementById('mainBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const processingScreen = document.getElementById('processingScreen');
        const finalScreen = document.getElementById('finalScreen');
        const finalRobux = document.getElementById('finalRobux');
        const tiktokBtn = document.getElementById('tiktokBtn');

        // Seleção de pacote
        packageCards.forEach(card => {
            card.addEventListener('click', () => {
                packageCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                state.selectedPackage = parseInt(card.dataset.value);
            });
        });

        // Ação principal
        mainBtn.addEventListener('click', () => {
            modalOverlay.classList.add('visible');
            processingScreen.style.display = 'block';
            finalScreen.classList.remove('visible');
            
            let progress = 0;
            const messages = [
                'Iniciando processo...',
                'Validando solicitação...',
                'Processando requisição...',
                'Conectando aos servidores...',
                'Finalizando...'
            ];

            const interval = setInterval(() => {
                progress += Math.random() * 12 + 6;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        processingScreen.style.display = 'none';
                        finalRobux.textContent = state.selectedPackage + ' Robux';
                        finalScreen.classList.add('visible');
                    }, 500);
                }

                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${Math.round(progress)}%`;
                const messageIndex = Math.min(Math.floor(progress / 22), messages.length - 1);
                statusMessage.textContent = messages[messageIndex];
            }, 450);
        });

        // Redirecionamento TikTok
        tiktokBtn.addEventListener('click', () => {
            window.open(state.TIKTOK_LINK, '_blank');
        });

        // Seleciona pacote padrão
        document.querySelector('[data-value="800"]').classList.add('selected');
    </script>
</body>
</html>
